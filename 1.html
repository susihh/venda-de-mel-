<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    /* Tela de Abertura (Splash) */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease; /* Efeito suave ao sumir */
    }

    #splash-screen img {
      max-width: 200px;
      height: auto;
    }

    /* Tela de Apresentação */
    #home-screen {
      display: none; /* Escondida inicialmente */
      padding: 20px;
      text-align: center;
    }

    .hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- 1. TELA DE ABERTURA -->
  <div id="splash-screen">
    <!-- Substitua o src abaixo pelo caminho da sua imagem -->
    <img src="1.png" alt="Logo do App">
  </div>

  <!-- 2. TELA DE APRESENTAÇÃO -->
  <div id="home-screen">
    <h1>Bem-vindo ao App!</h1>
    <p>Esta é a página de apresentação do seu aplicativo.</p>
  </div>

  <script>
    // Aguarda 5000 milissegundos (5 segundos)
    setTimeout(() => {
      const splash = document.getElementById('splash-screen');
      const home = document.getElementById('home-screen');

      // Efeito visual de esmaecer a abertura
      splash.classList.add('hidden');

      setTimeout(() => {
        splash.style.display = 'none'; // Remove completamente a abertura
        home.style.display = 'block';  // Exibe a tela de apresentação
      }, 500); // Aguarda o fim da animação do CSS

    }, 5000);
  </script>

</body>
</html>
