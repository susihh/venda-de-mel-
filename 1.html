<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    /* Tela de Abertura (Splash) */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
      overflow: hidden;
    }

    #splash-screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    /* Estilos Globais das Telas de Apresentação */
    .screen {
      display: none;
      min-height: 100vh;
      background-color: #ffffff;
      color: #000000;
      padding: 40px 20px;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
    }

    .active {
      display: flex;
    }

    .content {
      margin-auto: 0;
      max-width: 400px;
    }

    .content h1 {
      font-size: 28px;
      margin-bottom: 16px;
    }

    /* Detalhe em Amarelo */
    .highlight {
      color: #ffcc00;
    }

    .border-detail {
      width: 60px;
      height: 4px;
      background-color: #ffcc00;
      margin: 15px auto;
      border-radius: 2px;
    }

    .content p {
      font-size: 16px;
      color: #333333;
      line-height: 1.5;
    }

    /* Botões com Estilo Amarelo */
    .btn {
      background-color: #ffcc00;
      color: #000000;
      border: none;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      width: 100%;
      max-width: 300px;
      transition: transform 0.2s, background-color 0.2s;
    }

    .btn:hover {
      background-color: #e6b800;
      transform: scale(1.02);
    }

    .hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- 1. TELA DE ABERTURA (SPLASH) -->
  <div id="splash-screen">
    <img src="1.png" alt="Abertura do App">
  </div>

  <!-- 2. PRIMEIRA PÁGINA DE APRESENTAÇÃO -->
  <div id="page-1" class="screen">
    <div class="content">
      <h1>Bem-vindo ao <span class="highlight">App</span></h1>
      <div class="border-detail"></div>
      <p>Descubra uma nova experiência para organizar o seu dia a dia de forma simples e rápida.</p>
    </div>
    <button class="btn" onclick="nextPage('page-1', 'page-2')">Avançar</button>
  </div>

  <!-- 3. SEGUNDA PÁGINA DE APRESENTAÇÃO -->
  <div id="page-2" class="screen">
    <div class="content">
      <h1>Tudo em um <span class="highlight">Só Lugar</span></h1>
      <div class="border-detail"></div>
      <p>Acesse suas ferramentas favoritas, acompanhe seus resultados e receba notificações em tempo real.</p>
    </div>
    <button class="btn" onclick="finishIntro()">Começar Agora</button>
  </div>

  <script>
    // Aguarda 5 segundos para fechar a abertura e mostrar a Página 1
    setTimeout(() => {
      const splash = document.getElementById('splash-screen');
      const page1 = document.getElementById('page-1');

      splash.classList.add('hidden');

      setTimeout(() => {
        splash.style.display = 'none';
        page1.classList.add('active');
      }, 500);
    }, 5000);

    // Função para trocar de página de apresentação
    function nextPage(currentId, nextId) {
      document.getElementById(currentId).classList.remove('active');
      document.getElementById(nextId).classList.add('active');
    }

    // Função executada ao clicar no último botão
    function finishIntro() {
      alert('Apresentação concluída! Redirecionando para o app principal...');
    }
  </script>

</body>
</html>
